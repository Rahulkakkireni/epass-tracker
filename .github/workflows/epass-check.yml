name: Telangana ePASS check

on:
  workflow_dispatch:
  schedule:
    # Runs daily at 22:45 IST.
    - cron: "15 17 * * *"

permissions:
  contents: write
  issues: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install playwright beautifulsoup4 lxml
          python -m playwright install --with-deps chromium

      - name: Check Telangana ePASS
        id: epass
        run: python scripts/epass_check.py

      - name: Save notification state
        if: success()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add epass-notification-state.md
          if git diff --cached --quiet; then
            echo "No state changes."
          else
            git commit -m "Update Telangana ePASS notification state"
            git push
          fi

      - name: Create issue for new notification
        if: success() && hashFiles('epass-notification-message.md') != ''
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require("fs");
            const body = fs.readFileSync("epass-notification-message.md", "utf8").trim();
            if (!body) return;
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: "Telangana ePASS status update",
              body
            });

